stages:
  - install
  - test
  - report

variables:
  NODE_VERSION: "18"
  ALLURE_VERSION: "2.25.0"

# Cache para node_modules
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

# Instalação das dependências
install_dependencies:
  stage: install
  image: node:${NODE_VERSION}
  script:
    - echo "Instalando dependências..."
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 day
  only:
    - branches
    - merge_requests

# Testes no BrowserStack - Android
test_android_browserstack:
  stage: test
  image: node:${NODE_VERSION}
  dependencies:
    - install_dependencies
  script:
    - echo "Executando testes Android no BrowserStack..."
    - npm run test:browserstack
  artifacts:
    when: always
    paths:
      - allure-results/
      - screenshots/
    reports:
      junit: allure-results/*.xml
    expire_in: 7 days
  only:
    - branches
    - merge_requests
  allow_failure: false
  timeout: 1h

