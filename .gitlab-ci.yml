# Geração do relatório Allure
generate_allure_report:
  stage: report
  image: node:${NODE_VERSION}
  dependencies:
    - test_android_browserstack
  before_script:
    - apt-get update && apt-get install -y default-jre
  script:
    - echo "Gerando relatório Allure..."
    - npm run allure:generate
  artifacts:
    paths:
      - allure-report/
    expire_in: 30 days
  only:
    - branches
    - merge_requests
  when: always

# Job para publicar relatório em Pages (opcional)
pages:
  stage: report
  dependencies:
    - generate_allure_report
  script:
    - mkdir -p public
    - cp -r allure-report/* public/
  artifacts:
    paths:
      - public
    expire_in: 30 days
  only:
    - main
    - master
  when: always
